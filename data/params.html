<!DOCTYPE HTML>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css">
	<title>HX3 Edit Board Params</title>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			var param, value, max;
			var type = "";
			var desc = "";
			var items = '<table class="param-table">';
			// sieht aus, als hätte man ein Gürteltier über die Tastatur gewälzt
			fetch('getparams_json').then(function (response) {
				return response.json();
			}).then(function (json) {
				for (var i = 0; i < json.length - 1; i++) {	// es folgt noch 1 Zeile mit Page-#, deshalb -1!
					desc = json[i].desc;
					if (json[i].param == '#') {
						// erste Zeile fett
						items += `<tr class="firstline">
						<td>#</td>
						<td>${desc}</td>
						<td>Value</td>
						<td></td>
						</tr>`;
					} else {
						// normale Datenzeile
						param = +json[i].param;
						value = +json[i].value;
						type = json[i].type;
						max = json[i].max;
						items += `<tr><td>${param}</td><td>${desc}</td>`;
						if (type == 'trk') {
							// Slider, Drawbar/Schieberegler
							items += `<td><input type="range" min="0" max="${max}" class="slider" value="${value}" id="param_${param}" oninput="post_sliderval(${param})"></td>
							<td><small><span id="trackval_${param}">${value}</span></small></td>`;
						} else if (type == 'btn') {
							// Button/Tab (Boolean)
							let checked = "";
							if (value > 0) checked = "checked";
							items += `<td><label class="switch"><input type="checkbox" name="param_${param}" id="param_${param}" ${checked} onclick="post_btnval(${param})"/><span class="slider_sw"></span></label></td><td></td>`;
						} else if (type == 'bit') {
							// 8-Bit-Maske
							var bits = ["", "", "", "", "", "", "", ""];
							var mask = 128;
							items += `<td>`;
							for (var bit_idx = 7; bit_idx >= 0; bit_idx--) {
								if (value & mask) bits[bit_idx] = "checked";
								mask = mask >>> 1;
								items += `<input id="param_${param}_bit_${bit_idx}" onclick="post_bitval(${param})" style="width: 15px" type="checkbox" ${bits[bit_idx]}>`;
							}
							items += `<input id="param_${param}" type="hidden" value="${value}"></td><td></td>`;
						} else {
							// numerische und andere Felder
							items += `<td><input id="param_${param}" type="number" name="param_val" value="${value}" oninput="post_paramval(${param},${max})"></td>
							<td><small>(max. ${max})</small></td>`;
						}
					}
				}
				items += "</table>";
				document.getElementById("list").innerHTML = items;
				var page = json[i].page;
				// Navigation disablen, sind beim Laden automatisch enabled
				var pageBtn = document.getElementById("page_" + page);
				if (pageBtn) pageBtn.setAttribute('disabled', 'disabled');
				if (page == 0) document.getElementById("prev").setAttribute('disabled', 'disabled');
				if (page == 9) document.getElementById("next").setAttribute('disabled', 'disabled');
				document.getElementById("insert_info").innerHTML = `<b>Param Page ${page} </b>&nbsp;&nbsp;<small>(file params_${page}.txt)</small>`;
				hideWaitBanner();
			}).catch(function (err) {
				console.error('getparams_json error:', err);
				hideWaitBanner("Could not load parameters.");
			});
		});

		function hideWaitBanner(errorText) {
			// Banner ausblenden, sobald die Daten da sind; bei Fehler stattdessen Meldung zeigen
			const banner = document.getElementById("wait-banner");
			if (errorText) {
				banner.textContent = errorText;
				banner.classList.add("wait-banner-error");
			} else {
				banner.classList.add("wait-banner-hidden");
			}
		}

		function post_val(param, pval, to_eep) {
			// Sende String, wird komplett als POST-Arg(0) empfangen, ist HX35-Befehl          
			document.getElementById("msg_par").innerHTML = "#" + param + "=" + pval;	// oben anzeigen
			fetch(`/setparval?param=${param}&val=${pval}&to_eep=${to_eep}`)
				.catch(err => console.error('setparam error:', err));
		}

		function post_paramval(param, pmax) {
			// Submit-Button
			var pval = document.getElementById("param_" + param).value;	// aus erzeugtem Dokument holen
			if (document.getElementById("param_" + param).checked) pval = 255;	// war Switch
			if ((+pval > +pmax) || (+pval < 0) || (pval == "")) {		// mit "+" in Zahl konvertieren!
				document.getElementById("msg_par").innerHTML = "Out of Range (max. " + pmax + ")!";
			} else {
				post_val(param, pval, true); // Sende Wert         
			}
		}

		function post_bitval(param) {
			// Bitfeld senden
			let temp_val = 0;
			let mask = 1;
			for (var bit_idx = 0; bit_idx < 8; bit_idx++) {
				if (document.getElementById("param_" + param + "_bit_" + bit_idx).checked) temp_val += mask;	// Bit ON
				mask = mask << 1;
			}
			document.getElementById("param_" + param).value = temp_val;
			post_val(param, temp_val, false);
		}

		function post_btnval(param) {
			// Switch/Checkbox senden
			var pval = 0;
			if (document.getElementById("param_" + param).checked) pval = 255;	// Switch ON
			post_val(param, pval, false); // Sende Wert         
		}

		function post_sliderval(param) {
			// Slider/Track senden
			var pval = document.getElementById("param_" + param).value;	// aus erzeugtem Dokument holen
			document.getElementById("trackval_" + param).innerHTML = pval;
			post_val(param, pval, false); // Sende Wert         
		}
	</script>
</head>

<body class="panel-page">
	<div class="wait-banner" id="wait-banner">Please wait, loading parameters...</div>
	<div class="panel">
		<div class="panel-header">
			<div>
				<h1 id="h1_msg">HX3 Board Params</h1>
				<p>Edit HX3 board parameters</p>
			</div>
		</div>

		<section class="panel-section">
			<h2>Parameter Pages</h2>
			<form action="/navbutton">
				<div class="nav-row">
					<input class="btn" id="prev" type="submit" name="param_prev" value="Previous">
					<input class="btn" id="next" type="submit" name="param_next" value="Next">
				</div>
				<div class="page-grid">
					<input id="page_0" class="btn" type="submit" name="param_page" value="0">
					<input id="page_1" class="btn" type="submit" name="param_page" value="1">
					<input id="page_2" class="btn" type="submit" name="param_page" value="2">
					<input id="page_3" class="btn" type="submit" name="param_page" value="3">
					<input id="page_4" class="btn" type="submit" name="param_page" value="4">
					<input id="page_5" class="btn" type="submit" name="param_page" value="5">
					<input id="page_6" class="btn" type="submit" name="param_page" value="6">
					<input id="page_7" class="btn" type="submit" name="param_page" value="7">
					<input id="page_8" class="btn" type="submit" name="param_page" value="8">
					<input id="page_9" class="btn" type="submit" name="param_page" value="9">
				</div>
			</form>
			<div class="info-row">
				<span id="insert_info">Page Info</span>
				<span id="msg_par" class="status-err"></span>
			</div>
		</section>

		<section class="panel-section">
			<div class="insert_params" id="list"></div>
		</section>

		<section class="panel-section">
			<button class="btn btn-green btn-wide" onclick="post_paramval(905,1)">Save to HX3</button>
		</section>
    
		<nav class="panel-links">
			<a class="btn" href="/">Start Page</a>
			<a class="btn" href="/upper.html">Upper Manual</a>
			<a class="btn" href="/lower.html">Lower Manual</a>
			<a class="btn" href="/pedal.html">Pedal</a>
			<span class="btn current">HX3 Parameters</span>
			<a class="btn" href="/boardinfo.html">Board Info</a>
		</nav>
	</div>

</body>

</html>
